<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="50%" stop-color="#0D131F"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>

    <!-- Accent Top Border Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Terminal Box Gradient -->
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B0F17"/>
    </linearGradient>

    <!-- Dot Pattern for Blueprint feel -->
    <pattern id="gridDots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1E293B" opacity="0.45"/>
    </pattern>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif; font-weight: 800; font-size: 32px; fill: #F8FAFC; letter-spacing: -0.5px; }
    .handle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif; font-weight: 500; font-size: 18px; fill: #64748B; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif; font-weight: 500; font-size: 14px; fill: #94A3B8; }
    .status-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif; font-weight: 600; font-size: 11px; fill: #38BDF8; letter-spacing: 1px; text-transform: uppercase; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif; font-weight: 500; font-size: 11px; fill: #94A3B8; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace; }
  </style>

  <!-- Base Card -->
  <rect x="2" y="2" width="956" height="236" rx="12" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5"/>
  
  <!-- Dot Pattern Layer -->
  <rect x="3" y="3" width="954" height="234" rx="11" fill="url(#gridDots)" />

  <!-- Top Accent Highlight -->
  <path d="M 14 3 L 946 3" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Left Side: Identity -->
  <g transform="translate(36, 32)">
    <!-- Status Badge -->
    <g transform="translate(0, 4)">
      <rect x="0" y="0" width="310" height="24" rx="12" fill="#0E1E2E" stroke="#164E63" stroke-width="1"/>
      <circle cx="12" cy="12" r="4" fill="#38BDF8">
        <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <text x="24" y="16" class="status-text">ENGINEERING WITH VERIFIABLE EVIDENCE</text>
    </g>

    <!-- Name & Handle -->
    <text x="0" y="62" class="title">Zoran Knežević <tspan class="handle">/ o0o0o0o</tspan></text>

    <!-- Subtitle / Title -->
    <text x="0" y="88" class="subtitle">Software Engineer · QA Automation · Full-Stack Systems · AI Workflows</text>

    <!-- Core Value Pills -->
    <g transform="translate(0, 114)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="168" height="26" rx="6" fill="#111827" stroke="#1F2937" stroke-width="1"/>
        <text x="10" y="17" class="pill-text mono"><tspan fill="#10B981">✓</tspan> Deterministic Gates</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(176, 0)">
        <rect x="0" y="0" width="176" height="26" rx="6" fill="#111827" stroke="#1F2937" stroke-width="1"/>
        <text x="10" y="17" class="pill-text mono"><tspan fill="#38BDF8">✓</tspan> Tamper-Evident Logs</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(360, 0)">
        <rect x="0" y="0" width="162" height="26" rx="6" fill="#111827" stroke="#1F2937" stroke-width="1"/>
        <text x="10" y="17" class="pill-text mono"><tspan fill="#818CF8">✓</tspan> Release Hardening</text>
      </g>
    </g>
  </g>

  <!-- Right Side: Minimalist Evidence Terminal Box -->
  <g transform="translate(615, 28)">
    <rect x="0" y="0" width="310" height="184" rx="8" fill="url(#termGrad)" stroke="#1E293B" stroke-width="1.2"/>
    
    <!-- Window Controls -->
    <circle cx="16" cy="16" r="4.5" fill="#EF4444" opacity="0.8"/>
    <circle cx="30" cy="16" r="4.5" fill="#F59E0B" opacity="0.8"/>
    <circle cx="44" cy="16" r="4.5" fill="#10B981" opacity="0.8"/>
    <text x="60" y="20" class="mono" font-size="11" fill="#475569">verification_engine.sh</text>
    <line x1="0" y1="32" x2="310" y2="32" stroke="#1E293B" stroke-width="1"/>

    <!-- Terminal Output -->
    <g transform="translate(16, 52)" class="mono" font-size="11">
      <text x="0" y="0" fill="#64748B">$ <tspan fill="#F8FAFC">verify --candidate release</tspan></text>
      
      <text x="0" y="22" fill="#10B981">[PASS]</text>
      <text x="48" y="22" fill="#94A3B8">248/248 unit &amp; contract</text>

      <text x="0" y="42" fill="#10B981">[PASS]</text>
      <text x="48" y="42" fill="#94A3B8">34 e2e journey gates</text>

      <text x="0" y="62" fill="#38BDF8">[EVID]</text>
      <text x="48" y="62" fill="#94A3B8">SHA-256 hash-chain OK</text>

      <line x1="0" y1="76" x2="278" y2="76" stroke="#1E293B" stroke-width="1" stroke-dasharray="3 3"/>

      <text x="0" y="96" fill="#64748B">STATE:</text>
      <text x="50" y="96" fill="#10B981" font-weight="700">VERIFIED &amp; DEPLOYABLE</text>
      <circle cx="218" cy="93" r="3.5" fill="#10B981"/>
    </g>
  </g>
</svg>
